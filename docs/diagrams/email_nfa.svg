<text class="small" x="24" y="602">A = one ASCII letter/digit; letter = one ASCII letter; sep = one local separator (._-).</text>
<text class="small" x="24" y="622">At a domain dot the NFA branches: continue another label, or guess the suffix begins.</text>
<text class="small" x="24" y="642">n0 local start · n1 local part · n2 after local separator · n3 after @ · n4 domain label</text>
<text class="small" x="24" y="662">n5 after domain hyphen · n6 after domain dot · n7/n8 suffix characters · n9 accepting</text>
