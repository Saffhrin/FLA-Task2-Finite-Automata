<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 455" role="img" aria-label="Four-digit PIN DFA transition diagram">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#344054"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#172b4d}.edge{fill:none;stroke:#344054;stroke-width:2;marker-end:url(#arrow)}.node{fill:#fff;stroke:#344054;stroke-width:2}.label{font-size:15px}.note{font-size:14px;fill:#526174}</style>
<text x="24" y="32" font-size="20" font-weight="700">Four-digit PIN DFA</text>
<path class="edge" d="M18,130 L57,130"/>
<path class="edge" d="M127,130 L238,130"/>
<rect x="125.0" y="99" width="114" height="22" rx="5" fill="#fff"/>
<text class="label" x="182" y="116" text-anchor="middle">D (one digit)</text>
<path class="edge" d="M302,130 L413,130"/>
<rect x="300.0" y="99" width="114" height="22" rx="5" fill="#fff"/>
<text class="label" x="357" y="116" text-anchor="middle">D (one digit)</text>
<path class="edge" d="M477,130 L588,130"/>
<rect x="475.0" y="99" width="114" height="22" rx="5" fill="#fff"/>
<text class="label" x="532" y="116" text-anchor="middle">D (one digit)</text>
<path class="edge" d="M652,130 L763,130"/>
<rect x="650.0" y="99" width="114" height="22" rx="5" fill="#fff"/>
<text class="label" x="707" y="116" text-anchor="middle">D (one digit)</text>
<path class="edge" d="M95,162 C105,235 315,270 418,329"/>
<rect x="138.0" y="205" width="34" height="22" rx="5" fill="#fff"/>
<text class="label" x="155" y="222" text-anchor="middle">O</text>
<path class="edge" d="M270,162 C280,225 365,270 430,329"/>
<rect x="293.0" y="229" width="34" height="22" rx="5" fill="#fff"/>
<text class="label" x="310" y="246" text-anchor="middle">O</text>
<path class="edge" d="M445,162 L445,325"/>
<rect x="458.0" y="228" width="34" height="22" rx="5" fill="#fff"/>
<text class="label" x="475" y="245" text-anchor="middle">O</text>
<path class="edge" d="M620,162 C610,225 525,270 460,329"/>
<rect x="563.0" y="229" width="34" height="22" rx="5" fill="#fff"/>
<text class="label" x="580" y="246" text-anchor="middle">O</text>
<path class="edge" d="M795,162 C785,235 575,270 472,329"/>
<rect x="718.0" y="205" width="34" height="22" rx="5" fill="#fff"/>
<text class="label" x="735" y="222" text-anchor="middle">any</text>
<path class="edge" d="M421,338 C378,285 512,285 469,338"/>
<rect x="428.0" y="261" width="34" height="22" rx="5" fill="#fff"/>
<text class="label" x="445" y="278" text-anchor="middle">any</text>
<circle class="node" cx="95" cy="130" r="32" stroke="#344054"/>
<text x="95" y="130" text-anchor="middle" dominant-baseline="middle" font-size="16">q0</text>
<circle class="node" cx="270" cy="130" r="32" stroke="#344054"/>
<text x="270" y="130" text-anchor="middle" dominant-baseline="middle" font-size="16">q1</text>
<circle class="node" cx="445" cy="130" r="32" stroke="#344054"/>
<text x="445" y="130" text-anchor="middle" dominant-baseline="middle" font-size="16">q2</text>
<circle class="node" cx="620" cy="130" r="32" stroke="#344054"/>
<text x="620" y="130" text-anchor="middle" dominant-baseline="middle" font-size="16">q3</text>
<circle class="node" cx="795" cy="130" r="32" stroke="#155eef"/>
<circle cx="795" cy="130" r="26" fill="none" stroke="#155eef" stroke-width="1.5"/>
<text x="795" y="130" text-anchor="middle" dominant-baseline="middle" font-size="16">q4</text>
<circle class="node" cx="445" cy="360" r="32" stroke="#344054"/>
<text x="445" y="360" text-anchor="middle" dominant-baseline="middle" font-size="16">dead</text>
<text class="note" x="24" y="414">D = one ASCII digit (0–9; e.g. 7); O = one non-digit character. q4 accepts at end; extra input reaches dead.</text>
