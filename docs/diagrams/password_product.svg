<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 270" role="img" aria-label="Password policy product DFA">
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#172b4d}.box{fill:#f8fafc;stroke:#98a2b3;stroke-width:1.5}.arrow{stroke:#344054;stroke-width:2;marker-end:url(#arr)}.muted{fill:#526174;font-size:13px}</style>
<defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#344054"/></marker></defs>
<text x="24" y="32" font-size="20" font-weight="700">Password policy: direct product of five small DFAs</text>
<rect class="box" x="30" y="68" width="160" height="112" rx="12"/>
<text x="110" y="96" text-anchor="middle" font-weight="700">Length</text>
<text x="110" y="127" text-anchor="middle" font-size="14">0 → 1 → … → 8+</text>
<text class="muted" x="110" y="154" text-anchor="middle">accept when 8+</text>
<rect class="box" x="220" y="68" width="160" height="112" rx="12"/>
<text x="300" y="96" text-anchor="middle" font-weight="700">Uppercase</text>
<text x="300" y="127" text-anchor="middle" font-size="14">unseen → seen</text>
<text class="muted" x="300" y="154" text-anchor="middle">ASCII A–Z</text>
<rect class="box" x="410" y="68" width="160" height="112" rx="12"/>
<text x="490" y="96" text-anchor="middle" font-weight="700">Lowercase</text>
<text x="490" y="127" text-anchor="middle" font-size="14">unseen → seen</text>
<text class="muted" x="490" y="154" text-anchor="middle">ASCII a–z</text>
<rect class="box" x="600" y="68" width="160" height="112" rx="12"/>
<text x="680" y="96" text-anchor="middle" font-weight="700">Digit</text>
<text x="680" y="127" text-anchor="middle" font-size="14">unseen → seen</text>
<text class="muted" x="680" y="154" text-anchor="middle">ASCII 0–9</text>
<rect class="box" x="790" y="68" width="160" height="112" rx="12"/>
<text x="870" y="96" text-anchor="middle" font-weight="700">Special</text>
<text x="870" y="127" text-anchor="middle" font-size="14">unseen → seen</text>
<text class="muted" x="870" y="154" text-anchor="middle">ASCII non-alphanumeric</text>
<text x="490" y="218" text-anchor="middle" font-size="16" font-weight="700">Accept when length = 8+ AND all four category flags are seen</text>
<text class="muted" x="490" y="244" text-anchor="middle">At most 144 product states; 112 are reachable over the model’s input classes</text>
</svg>
